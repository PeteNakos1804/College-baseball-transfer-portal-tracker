<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Baseball Transfer Portal Tracker 2026</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
    .tp-wrap{max-width:960px;margin:0 auto;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.4);}
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:#8a8fa3;font-size:15px;}
    .spinner{width:36px;height:36px;border:3px solid #324250;border-top-color:#f5361a;border-radius:50%;animation:spin 0.7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .error-box{padding:32px 20px;text-align:center;color:#ef4444;font-size:14px;}
    /* Dark/Light vars applied via JS */
  </style>
</head>
<body>
<div class="tp-wrap" id="portal-root">
  <div class="loading" id="loading-state">
    <div class="spinner"></div>
    <span>Loading transfer portal data…</span>
  </div>
</div>

<script>
(function(){
  var SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRAh0-AQ4fwvIwfsDntMavAEWDbevsXpD6XcSLBuwTrVjwcQtMVXymadBUj8TQcrw93otUNrvP2rPqK/pub?gid=1172251547&single=true&output=csv";
  var PAGE_SIZE = 25;

  // ── Theme tokens ──────────────────────────────────────────────────────────
  var DARK_VARS  = "--tp-bg:#1C252C;--tp-surface:#212E37;--tp-surface2:#253240;--tp-border:#324250;--tp-border2:#293640;--tp-text:#e2e4ea;--tp-text-muted:#8a8fa3;--tp-text-dim:#6b7084;--tp-text-dimmer:#50546a;--tp-name:#ffffff;--tp-stats:#8bb4e0;--tp-stripe:#1a2830;--tp-stats-bg:#181f25;--tp-stats-label:rgba(255,255,255,0.65);";
  var LIGHT_VARS = "--tp-bg:#f0f4f7;--tp-surface:#ffffff;--tp-surface2:#f0f4f7;--tp-border:#d1d5db;--tp-border2:#e5e7eb;--tp-text:#1a1d23;--tp-text-muted:#6b7280;--tp-text-dim:#64748b;--tp-text-dimmer:#94a3b8;--tp-name:#111827;--tp-stats:#1d4ed8;--tp-stripe:#e8edf2;--tp-stats-bg:#e2e8ef;--tp-stats-label:#64748b;";
  var isDark = true;

  var STATUS_STYLES = {
    available: {bg:"#2563eb",label:"Available"},
    committed: {bg:"#16a34a",label:"Committed"},
    enrolled:  {bg:"#7c3aed",label:"Enrolled"},
    withdrawn: {bg:"#dc2626",label:"Withdrawn"}
  };
  function getStatus(s){ return STATUS_STYLES[s] || STATUS_STYLES.available; }

  function badgeColor(type){
    if(type==="pitcher")  return {bg:"#dc2626",text:"#fff"};
    if(type==="two-way")  return {bg:"#7c3aed",text:"#fff"};
    return {bg:"#1e3a5f",text:"#fff"};
  }

  // ── CSV parser ────────────────────────────────────────────────────────────
  function splitCSVRow(row){
    var fields=[],cur="",inQuote=false;
    for(var i=0;i<row.length;i++){
      var ch=row[i];
      if(ch==='"'){inQuote=!inQuote;}
      else if(ch===","&&!inQuote){fields.push(cur);cur="";}
      else{cur+=ch;}
    }
    fields.push(cur);
    return fields;
  }

  function parseCSV(text){
    var lines=text.trim().split(/\r?\n/);
    if(lines.length<2)return[];
    var headers=splitCSVRow(lines[0]).map(function(h){return h.trim().toLowerCase();});
    return lines.slice(1).map(function(line){
      var values=splitCSVRow(line);
      var obj={};
      headers.forEach(function(h,i){obj[h]=(values[i]||"").trim();});
      return obj;
    }).filter(function(row){return Object.values(row).some(function(v){return v;});});
  }

  function csvRowToPlayer(row,id){
    function get(){
      for(var i=0;i<arguments.length;i++){
        var val=row[arguments[i].toLowerCase()];
        if(val!==undefined&&val!=="")return val;
      }
      return "";
    }
    function bool(){
      var v=get.apply(null,arguments).toLowerCase();
      return v==="yes"||v==="true"||v==="1";
    }
    var posType=get("type","position type","postype").toLowerCase();
    var normalizedType=posType.includes("pitch")?"pitcher":posType.includes("two")||posType.includes("2-way")?"two-way":"hitter";
    var rawStatus=get("status","commitment status","portal status").toLowerCase();
    var normalizedStatus=rawStatus.includes("commit")?"committed":rawStatus.includes("enroll")?"enrolled":rawStatus.includes("with")?"withdrawn":"available";
    return {
      id:id,
      name:get("name","player"),
      pos:get("position","pos"),
      posType:normalizedType,
      from:get("from","from school","previous school"),
      to:get("to","to school","destination","committed to"),
      stats:get("stats","key stats","statistics"),
      draftEligible:bool("draft","draft eligible"),
      gradTransfer:bool("grad transfer","grad","graduate transfer"),
      multiTransfer:bool("multi-time transfer","multi transfer","multitransfer","mt"),
      conference:get("conference","conf"),
      status:normalizedStatus,
    };
  }

  // ── Renderer ──────────────────────────────────────────────────────────────
  function renderPortal(players){
    var uid="tplv";
    var unknownDest='<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:var(--tp-border);color:var(--tp-text-dim);font-weight:800;font-size:13px;line-height:1;">?</span>';

    // Stats
    var total=players.length;
    var committed=players.filter(function(p){return p.status==="committed"||p.status==="enrolled";}).length;
    var available=players.filter(function(p){return p.status==="available";}).length;
    var pitchers=players.filter(function(p){return p.posType==="pitcher";}).length;
    var hitters=players.filter(function(p){return p.posType==="hitter";}).length;
    var twoWay=players.filter(function(p){return p.posType==="two-way";}).length;
    var pct=total?Math.round(committed/total*100):0;

    var allSchools=[...new Set([...players.map(function(p){return(p.from||"").trim();}), ...players.map(function(p){return(p.to||"").trim();})].filter(function(s){return s&&s!=="—"&&s.toLowerCase()!=="tbd";}))].sort();
    var allConfs=[...new Set(players.map(function(p){return(p.conference||"").trim();}).filter(Boolean))].sort();

    var rows=players.map(function(p,idx){
      var bc=badgeColor(p.posType);
      var stripe=idx%2===1?"background:var(--tp-stripe);":"";
      var hidden=idx>=PAGE_SIZE?"display:none;":"";
      return '<tr class="'+uid+'-row" data-ridx="'+idx+'" data-name="'+(p.name||"").trim()+'" data-pos="'+(p.pos||"").trim()+'" data-postype="'+p.posType+'" data-from="'+(p.from||"").trim()+'" data-to="'+(p.to||"").trim()+'" data-draft="'+(p.draftEligible?"Yes":"No")+'" data-conference="'+(p.conference||"").trim()+'" data-status="'+(p.status||"available")+'" data-gt="'+(p.gradTransfer?"1":"0")+'" data-mt="'+(p.multiTransfer?"1":"0")+'" data-stats="'+(p.stats||"").replace(/"/g,"&quot;")+'" style="'+hidden+stripe+'border-bottom:1px solid var(--tp-border2);">'
        +'<td style="padding:12px 14px;font-weight:700;color:var(--tp-name);border:none;"><div style="display:flex;align-items:center;gap:5px;"><span>'+p.name+'</span>'
        +(p.gradTransfer?'<span title="Grad Transfer" style="background:#3b82f6;color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:0.5px;margin-left:2px;">GT</span>':"")
        +(p.multiTransfer?'<span title="Multi-Time Transfer" style="background:#F59E0B;color:#111;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:0.5px;margin-left:2px;">MT</span>':"")
        +'</div></td>'
        +'<td class="'+uid+'-col-pos" style="padding:12px 14px;border:none;"><span style="display:inline-block;background:'+bc.bg+';color:'+bc.text+';font-size:11px;font-weight:700;padding:2px 9px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;">'+p.pos+'</span></td>'
        +'<td style="padding:12px 14px;border:none;"><div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;"><span style="color:var(--tp-text-dim);">'+(p.from||"—")+'</span> <span style="color:#f5361a;font-weight:700;">&rarr;</span> '+(p.to?'<span style="font-weight:700;color:var(--tp-text);">'+p.to+'</span>':unknownDest)+'</div></td>'
        +'<td class="'+uid+'-col-stats" style="padding:12px 14px;font-weight:600;color:var(--tp-stats);border:none;">'+p.stats+'</td>'
        +'<td style="padding:12px 14px;border:none;"><span style="display:inline-block;background:'+getStatus(p.status).bg+';color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;">'+getStatus(p.status).label+'</span></td>'
        +'</tr>';
    }).join("");

    var cards=players.map(function(p,idx){
      var bc=badgeColor(p.posType);
      var badges=(p.gradTransfer?'<span title="Grad Transfer" style="background:#3b82f6;color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:0.5px;margin-left:2px;">GT</span>':"")
        +(p.multiTransfer?'<span title="Multi-Time Transfer" style="background:#F59E0B;color:#111;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:0.5px;margin-left:2px;">MT</span>':"");
      var cardHidden=idx>=PAGE_SIZE?"display:none;":"";
      return '<div class="'+uid+'-card" data-ridx="'+idx+'" data-name="'+(p.name||"").trim()+'" data-pos="'+(p.pos||"").trim()+'" data-postype="'+p.posType+'" data-from="'+(p.from||"").trim()+'" data-to="'+(p.to||"").trim()+'" data-draft="'+(p.draftEligible?"Yes":"No")+'" data-conference="'+(p.conference||"").trim()+'" data-status="'+(p.status||"available")+'" data-gt="'+(p.gradTransfer?"1":"0")+'" data-mt="'+(p.multiTransfer?"1":"0")+'" data-stats="'+(p.stats||"").replace(/"/g,"&quot;")+'" style="'+cardHidden+'background:var(--tp-surface);border-radius:8px;padding:14px 16px;margin:0 0 8px 0;border:1px solid var(--tp-border);">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;">'
        +'<div style="font-weight:700;color:var(--tp-name);font-size:15px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;">'+p.name+badges+'</div>'
        +'<span style="flex-shrink:0;background:'+bc.bg+';color:'+bc.text+';font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;margin-left:8px;">'+p.pos+'</span>'
        +'</div>'
        +'<div style="border-top:1px solid var(--tp-border2);margin:10px 0;"></div>'
        +'<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;">'
        +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-text-dimmer);margin-bottom:3px;">From</div><div style="color:var(--tp-text-dim);font-weight:600;font-size:13px;">'+(p.from||"—")+'</div></div>'
        +'<span style="color:#f5361a;font-weight:700;font-size:18px;">&rarr;</span>'
        +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-text-dimmer);margin-bottom:3px;">To</div>'+(p.to?'<div style="font-weight:700;color:var(--tp-text);font-size:13px;">'+p.to+'</div>':unknownDest)+'</div>'
        +'</div>'
        +(p.stats?'<div style="background:var(--tp-stripe);border-radius:5px;padding:7px 10px;margin-top:10px;font-size:12px;color:var(--tp-stats);font-weight:600;">'+p.stats+'</div>':"")
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">'
        +'<span style="font-size:11px;color:var(--tp-text-dimmer);">'+(p.conference||"")+'</span>'
        +'<span style="background:'+getStatus(p.status).bg+';color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:0.5px;">'+getStatus(p.status).label+'</span>'
        +'</div>'
        +'</div>';
    }).join("");

    var confOpts=allConfs.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join("");
    var schoolOpts=allSchools.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join("");

    var html = '<div id="'+uid+'" style="'+DARK_VARS+'max-width:960px;margin:0 auto;background:var(--tp-bg);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.4);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">'
      +'<div id="'+uid+'-hdr" style="background:#f5361a;padding:16px 20px;display:flex;align-items:center;gap:14px;">'
      +'<div style="font-size:19px;font-weight:800;color:#fff;letter-spacing:-0.3px;line-height:1.1;">College Baseball<br><span style="font-size:13px;font-weight:600;opacity:0.85;letter-spacing:0.5px;text-transform:uppercase;">Transfer Portal Tracker</span></div>'
      +'<div style="flex:1;"></div>'
      +'<div style="display:flex;gap:8px;align-items:center;">'
      +'<button id="'+uid+'-view-tbl" onclick="(function(){document.getElementById(''+uid+'-tbl-wrap').style.display='';document.getElementById(''+uid+'-cards-wrap').style.display='none';document.getElementById(''+uid+'-view-tbl').style.background='rgba(255,255,255,0.25)';document.getElementById(''+uid+'-view-cards').style.background='transparent';})()" style="background:rgba(255,255,255,0.25);border:none;color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">TABLE</button>'
      +'<button id="'+uid+'-view-cards" onclick="(function(){document.getElementById(''+uid+'-tbl-wrap').style.display='none';document.getElementById(''+uid+'-cards-wrap').style.display='';document.getElementById(''+uid+'-view-cards').style.background='rgba(255,255,255,0.25)';document.getElementById(''+uid+'-view-tbl').style.background='transparent';})()" style="background:transparent;border:none;color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:4px;cursor:pointer;letter-spacing:0.5px;">CARDS</button>'
      +'<button id="'+uid+'-theme" onclick="(function(){var el=document.getElementById(''+uid+'');var btn=document.getElementById(''+uid+'-theme');if(el.style.cssText.indexOf('#1C252C')>-1){el.style.cssText=''+LIGHT_VARS+'max-width:960px;margin:0 auto;background:var(--tp-bg);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.1);font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;';btn.textContent='☀';}else{el.style.cssText=''+DARK_VARS+'max-width:960px;margin:0 auto;background:var(--tp-bg);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.4);font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;';btn.textContent='☾';}})()" style="background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:16px;padding:4px 10px;border-radius:4px;cursor:pointer;">☾</button>'
      +'</div></div>'

      // Stats bar
      +'<div style="background:var(--tp-stats-bg);padding:12px 20px;display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--tp-border);">'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:var(--tp-name);">'+total+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">Total</span></div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:#22c55e;">'+committed+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">Committed</span></div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:#3b82f6;">'+available+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">Available</span></div>'
      +'<div style="width:1px;background:var(--tp-border);align-self:stretch;"></div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:#dc2626;">'+pitchers+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">Pitchers</span></div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:var(--tp-text);">'+hitters+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">Hitters</span></div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;"><span style="font-size:22px;font-weight:800;color:#7c3aed;">'+twoWay+'</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tp-stats-label);">2-Way</span></div>'
      +'<div style="flex:1;min-width:140px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:8px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tp-stats-label);"><span>Commitment Rate</span><span style="font-weight:700;color:var(--tp-text);">'+pct+'%</span></div>'
      +'<div style="background:var(--tp-border);border-radius:99px;height:5px;overflow:hidden;"><div style="background:#22c55e;height:100%;width:'+pct+'%;border-radius:99px;transition:width 0.4s;"></div></div>'
      +'</div></div>'

      // Controls
      +'<div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--tp-border);background:var(--tp-surface);">'
      +'<input id="'+uid+'-search" type="text" placeholder="Search players…" oninput="window['_'+uid+'apply']()" style="flex:1;min-width:160px;background:var(--tp-surface2);border:1px solid var(--tp-border);border-radius:5px;padding:7px 11px;font-size:13px;color:var(--tp-text);outline:none;" />'
      +'<select id="'+uid+'-fpos" onchange="window['_'+uid+'apply']()" style="background:var(--tp-surface2);border:1px solid var(--tp-border);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--tp-text);"><option value="">All Types</option><option value="pitcher">Pitchers</option><option value="hitter">Hitters</option><option value="two-way">Two-Way</option></select>'
      +'<select id="'+uid+'-fstat" onchange="window['_'+uid+'apply']()" style="background:var(--tp-surface2);border:1px solid var(--tp-border);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--tp-text);"><option value="">All Statuses</option><option value="available">Available</option><option value="committed">Committed</option><option value="enrolled">Enrolled</option><option value="withdrawn">Withdrawn</option></select>'
      +'<select id="'+uid+'-fconf" onchange="window['_'+uid+'apply']()" style="background:var(--tp-surface2);border:1px solid var(--tp-border);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--tp-text);"><option value="">All Conferences</option>'+confOpts+'</select>'
      +'<select id="'+uid+'-fschool" onchange="window['_'+uid+'apply']()" style="background:var(--tp-surface2);border:1px solid var(--tp-border);border-radius:5px;padding:7px 10px;font-size:12px;color:var(--tp-text);"><option value="">All Schools</option>'+schoolOpts+'</select>'
      +'<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tp-text-muted);cursor:pointer;"><input type="checkbox" id="'+uid+'-fgt" onchange="window['_'+uid+'apply']()" style="accent-color:#3b82f6;"> GT Only</label>'
      +'<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tp-text-muted);cursor:pointer;"><input type="checkbox" id="'+uid+'-fmt" onchange="window['_'+uid+'apply']()" style="accent-color:#F59E0B;"> MT Only</label>'
      +'</div>'

      // Table
      +'<div id="'+uid+'-tbl-wrap" style="overflow-x:auto;">'
      +'<table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--tp-text);">'
      +'<thead><tr style="background:var(--tp-surface2);text-transform:uppercase;font-size:10px;letter-spacing:1px;color:var(--tp-text-muted);">'
      +'<th class="'+uid+'-th" data-col="name" style="padding:10px 14px;text-align:left;border:none;cursor:pointer;">Player ↕</th>'
      +'<th class="'+uid+'-th" data-col="pos" style="padding:10px 14px;text-align:left;border:none;cursor:pointer;">Pos ↕</th>'
      +'<th style="padding:10px 14px;text-align:left;border:none;">Transfer</th>'
      +'<th class="'+uid+'-th '+uid+'-col-stats" data-col="stats" style="padding:10px 14px;text-align:left;border:none;cursor:pointer;">Key Stats ↕</th>'
      +'<th class="'+uid+'-th" data-col="status" style="padding:10px 14px;text-align:left;border:none;cursor:pointer;">Status ↕</th>'
      +'</tr></thead>'
      +'<tbody id="'+uid+'-tbody">'+rows+'</tbody>'
      +'</table></div>'

      // Cards
      +'<div id="'+uid+'-cards-wrap" style="display:none;padding:12px 16px;">'+cards+'</div>'

      // Pagination
      +'<div id="'+uid+'-pg-bar" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-top:1px solid var(--tp-border);background:var(--tp-surface);">'
      +'<span id="'+uid+'-pg-info" style="font-size:12px;color:var(--tp-text-muted);"></span>'
      +'<button id="'+uid+'-pg-prev" onclick="window['_'+uid+'page'](-1)" style="background:var(--tp-surface2);border:1px solid var(--tp-border);color:var(--tp-text);border-radius:4px;padding:5px 12px;cursor:pointer;font-size:12px;">← Prev</button>'
      +'<button id="'+uid+'-pg-next" onclick="window['_'+uid+'page'](1)" style="background:var(--tp-surface2);border:1px solid var(--tp-border);color:var(--tp-text);border-radius:4px;padding:5px 12px;cursor:pointer;font-size:12px;">Next →</button>'
      +'</div>'

      // Footer
      +'<div style="text-align:center;padding:10px;font-size:10px;color:var(--tp-text-dimmer);">Auto-updated from Google Sheets · Last loaded: <span id="'+uid+'-ts"></span></div>'
      +'</div>';

    document.getElementById("portal-root").innerHTML = html;
    document.getElementById(uid+"-ts").textContent = new Date().toLocaleString();

    // ── Interactive JS ────────────────────────────────────────────────────────
    var currentPage=0,sortCol="name",sortDir=1;
    var visibleRows=[],visibleCards=[];

    function $ (id){return document.getElementById(id);}

    function apply(){
      var q=$(uid+"-search").value.toLowerCase().trim();
      var fpos=$(uid+"-fpos").value;
      var fstat=$(uid+"-fstat").value;
      var fconf=$(uid+"-fconf").value;
      var fschool=$(uid+"-fschool").value;
      var fgt=$(uid+"-fgt").checked;
      var fmt=$(uid+"-fmt").checked;

      var allRows=Array.from(document.querySelectorAll("."+uid+"-row"));
      var cardMap={};
      Array.from(document.querySelectorAll("."+uid+"-card")).forEach(function(c){cardMap[c.getAttribute("data-ridx")]=c;});

      visibleRows=allRows.filter(function(r){
        if(q&&r.getAttribute("data-name").toLowerCase().indexOf(q)<0&&r.getAttribute("data-from").toLowerCase().indexOf(q)<0&&r.getAttribute("data-to").toLowerCase().indexOf(q)<0&&r.getAttribute("data-stats").toLowerCase().indexOf(q)<0)return false;
        if(fpos&&r.getAttribute("data-postype")!==fpos)return false;
        if(fstat&&r.getAttribute("data-status")!==fstat)return false;
        if(fconf&&r.getAttribute("data-conference")!==fconf)return false;
        if(fschool&&r.getAttribute("data-from")!==fschool&&r.getAttribute("data-to")!==fschool)return false;
        if(fgt&&r.getAttribute("data-gt")!=="1")return false;
        if(fmt&&r.getAttribute("data-mt")!=="1")return false;
        return true;
      });

      visibleRows.sort(function(a,b){
        var va=a.getAttribute("data-"+sortCol).toLowerCase();
        var vb=b.getAttribute("data-"+sortCol).toLowerCase();
        return va<vb?-1*sortDir:va>vb?1*sortDir:0;
      });

      currentPage=0;
      render();
    }

    function render(){
      var tbody=$(uid+"-tbody");
      var cardsEl=$(uid+"-cards-wrap");
      var start=currentPage*PAGE_SIZE;
      var end=start+PAGE_SIZE;
      var allRows=Array.from(document.querySelectorAll("."+uid+"-row"));
      var cardMap={};
      Array.from(document.querySelectorAll("."+uid+"-card")).forEach(function(c){cardMap[c.getAttribute("data-ridx")]=c;});

      allRows.forEach(function(r){r.style.display="none";});
      Object.values(cardMap).forEach(function(c){c.style.display="none";});

      var slice=visibleRows.slice(start,end);
      slice.forEach(function(r){
        r.style.display="";
        tbody.appendChild(r);
        var c=cardMap[r.getAttribute("data-ridx")];
        if(c){c.style.display="";cardsEl.appendChild(c);}
      });

      var total=visibleRows.length;
      var pgInfo=total+" player"+(total!==1?"s":"")+(total>PAGE_SIZE?" · Page "+(currentPage+1)+" of "+Math.ceil(total/PAGE_SIZE):"");
      $(uid+"-pg-info").textContent=pgInfo;
      $(uid+"-pg-prev").style.display=currentPage>0?"":"none";
      $(uid+"-pg-next").style.display=end<total?"":"none";
    }

    window["_"+uid+"apply"]=apply;
    window["_"+uid+"page"]=function(dir){
      var maxPage=Math.ceil(visibleRows.length/PAGE_SIZE)-1;
      currentPage=Math.max(0,Math.min(maxPage,currentPage+dir));
      render();
      document.getElementById(uid).scrollIntoView({behavior:"smooth",block:"start"});
    };

    // Column sort
    Array.from(document.querySelectorAll("."+uid+"-th")).forEach(function(th){
      th.addEventListener("click",function(){
        var col=th.getAttribute("data-col");
        if(sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=1;}
        apply();
      });
    });

    apply();
  }

  // ── Fetch & boot ──────────────────────────────────────────────────────────
  fetch(SHEETS_CSV_URL)
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.text();
    })
    .then(function(csv){
      var rows=parseCSV(csv);
      var players=rows.map(function(row,i){return csvRowToPlayer(row,i+1);}).filter(function(p){return p.name;});
      if(!players.length)throw new Error("No players found in sheet");
      renderPortal(players);
    })
    .catch(function(err){
      document.getElementById("portal-root").innerHTML='<div class="error-box"><strong>Could not load portal data</strong><br><small>'+err.message+'</small><br><small style="opacity:0.6">Make sure the Google Sheet is published to web as CSV and CORS is enabled.</small></div>';
    });
})();
</script>
</body>
</html>
